<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{appTitle}}</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="layout">
    <!-- 左侧抽屉：桌面常显，移动端通过汉堡切换 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">{{appTitle}}</div>
        <nav class="side-nav">
            <button class="side-item" data-scope="plaza" type="button"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>广场</button>
            <button class="side-item active" data-scope="mine" type="button"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>我的</button>
            <button class="side-item" data-scope="favorites" type="button"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.92 8.26 12 2"/></svg>收藏</button>
        </nav>
        <div class="sidebar-user">
            <div class="whoami" id="whoami">加载中…</div>
            <div class="user-links">
                <a id="adminLink" href="/auth/manager.html" class="hidden">管理</a>
                <button id="logoutBtn" class="link-btn" type="button">登出</button>
            </div>
        </div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <!-- 右侧主区 -->
    <div class="main">
        <header class="topbar">
            <button id="menuToggle" class="menu-toggle" type="button" aria-label="菜单"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <button id="detailBack" class="ghost back hidden" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg><span>返回</span></button>
            <input id="searchInput" class="search" type="search" placeholder="搜索标题 / 分类"/>
            <div class="grow"></div>
            <button id="selectBtn" class="ghost hidden" type="button" title="多选合并">选择</button>
            <button id="uploadBtn" class="primary" type="button">＋ 上传</button>
            <button id="backToTop" class="ghost to-top hidden" type="button" title="回到顶部">↑</button>
        </header>

        <!-- 列表视图 -->
        <main class="content" id="listView">
            <div id="grid" class="grid"></div>
            <div id="sentinel" class="sentinel"></div>
            <div id="loading" class="loading hidden">加载中…</div>
            <div id="endMsg" class="endmsg hidden">— 已经到底啦 —</div>
            <div id="empty" class="empty hidden">还没有内容</div>
        </main>

        <!-- 详情视图（点击卡片后展示；返回按钮在顶栏，操作图标分散到标题/描述/列表上方）-->
        <main class="content detail hidden" id="detailView">
            <div class="detail-info" id="detailInfo"></div>
            <div class="detail-body" id="detailBody"></div>
        </main>
    </div>
</div>

<!-- 上传弹层 -->
<div id="uploadModal" class="modal hidden" role="dialog">
    <div class="modal-mask"></div>
    <div class="modal-body">
        <div class="modal-head">
            <h3>上传</h3>
            <button class="close" data-close="uploadModal" type="button">×</button>
        </div>
        <div class="form-row">
            <label>标题 <input id="upTitle" type="text" placeholder="留空使用首个文件名"/></label>
            <label>分类 <input id="upCategory" type="text" placeholder="可选，便于搜索"/></label>
        </div>
        <div class="form-row">
            <label class="radio"><input id="upSeparate" type="checkbox"> 批量模式（每个文件单独成为一个资源，逐个上传）</label>
        </div>
        <div id="dropArea" class="drop">拖拽文件到此，或 <label class="filelabel">选择文件<input id="upFiles" type="file" multiple accept=".mp4,.webm,.mov,.mkv,.jpg,.jpeg,.png,.webp,.gif" hidden></label></div>
        <div id="fileList" class="filelist"></div>
        <div class="modal-foot">
            <div class="up-bar hidden" id="upBar"><div class="up-bar-fill" id="upBarFill"></div></div>
            <span id="upProgress" class="muted"></span>
            <div class="grow"></div>
            <button class="ghost" data-close="uploadModal" type="button">取消</button>
            <button id="upSubmit" class="primary" type="button">上传</button>
        </div>
    </div>
</div>

<!-- 编辑资源元信息弹层 -->
<div id="editModal" class="modal hidden" role="dialog">
    <div class="modal-mask"></div>
    <div class="modal-body">
        <div class="modal-head">
            <h3>编辑信息</h3>
            <button class="close" data-close="editModal" type="button">×</button>
        </div>
        <div class="form-row">
            <label>标题 <input id="editTitle" type="text"/></label>
            <label>分类 <input id="editCategory" type="text"/></label>
        </div>
        <div class="modal-foot">
            <div class="grow"></div>
            <button class="ghost" data-close="editModal" type="button">取消</button>
            <button id="editSubmit" class="primary" type="button">保存</button>
        </div>
    </div>
</div>

<!-- 确认弹层 -->
<div id="confirmModal" class="modal hidden" role="dialog">
    <div class="modal-mask"></div>
    <div class="modal-body narrow">
        <div class="modal-head"><h3>确认</h3></div>
        <div id="confirmText" class="confirm-text"></div>
        <div class="modal-foot">
            <div class="grow"></div>
            <button class="ghost" data-close="confirmModal" type="button">取消</button>
            <button id="confirmOk" class="danger" type="button">确定</button>
        </div>
    </div>
</div>

<!-- 大图 / 单视频 弹层：详情页里点击某个 item 时展示；全屏黑底，移动端左右滑动切换，底部显示文件名 -->
<div id="lightbox" class="modal hidden" role="dialog">
    <div class="modal-mask"></div>
    <div class="lightbox-body">
        <button class="lb-btn lb-close" data-close="lightbox" type="button">×</button>
        <button class="lb-btn lb-prev" id="lbPrev" type="button">‹</button>
        <div id="lbStage" class="lb-stage"></div>
        <button class="lb-btn lb-next" id="lbNext" type="button">›</button>
        <div class="lb-foot">
            <div class="lb-counter" id="lbCounter"></div>
            <div class="lb-name" id="lbName"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<!-- 多选模式底部操作栏：仅在列表页选择模式显示 -->
<div id="selectBar" class="select-bar hidden">
    <span class="sel-count" id="selCount">已选 0 项</span>
    <button id="selSelectAll" class="mini-btn" type="button">全选</button>
    <div class="grow"></div>
    <button id="selCancel" class="ghost" type="button">取消</button>
    <button id="selMerge" class="primary" type="button" disabled>合并所选</button>
</div>

<!-- 合并弹层：确认将选中的多个资源归并为一个新资源 -->
<div id="mergeModal" class="modal hidden" role="dialog">
    <div class="modal-mask"></div>
    <div class="modal-body">
        <div class="modal-head">
            <h3>合并资源</h3>
            <button class="close" data-close="mergeModal" type="button">×</button>
        </div>
        <div class="merge-summary" id="mergeSummary"></div>
        <div class="form-row">
            <label>新资源标题 <input id="mergeTitle" type="text" placeholder="留空使用首个资源标题"/></label>
            <label>分类 <input id="mergeCategory" type="text" placeholder="可选，便于搜索"/></label>
        </div>
        <div class="merge-warn">合并后所有文件将归入一个新资源，被选中的源资源将被删除（文件不会丢失）。</div>
        <div class="modal-foot">
            <div class="grow"></div>
            <button class="ghost" data-close="mergeModal" type="button">取消</button>
            <button id="mergeSubmit" class="primary" type="button">确定合并</button>
        </div>
    </div>
</div>

<script src="/auth/xie-auth.js" data-required></script>
<script src="/app.js"></script>
</body>
</html>
